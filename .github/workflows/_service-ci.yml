# Reusable CI/CD for every service. Owned by the PM only (see CODEOWNERS).
# Caller example: docs/templates/service-workflow.yml
name: Service CI

on:
  workflow_call:
    inputs:
      service:
        description: Service folder, for example auth-service
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  test:
    name: Lint and test (${{ inputs.service }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ inputs.service }}/package-lock.json

      - run: npm ci

      # Every caller must define a "lint" script (ESLint) in its package.json.
      - run: npm run lint

      # Coverage threshold (70%) is set in the service's Jest config; a miss fails this step.
      - run: npm test

  publish:
    name: Build and push (${{ inputs.service }})
    needs: test
    # Only a push to main publishes an image; PRs and other branches stop after tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ inputs.service }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ inputs.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service }}:sha-${{ github.sha }}

      - name: Update latest only for the current main commit
        shell: bash
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$main_sha" != "$BUILD_SHA" ]]; then
            echo "Main has moved on; leaving latest unchanged."
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$BUILD_DIGEST"
