# Reusable CI/CD for every service. Owned by the PM only (see CODEOWNERS).
# Caller example: docs/templates/service-workflow.yml
name: Service CI

on:
  workflow_call:
    inputs:
      service:
        description: Service folder, for example auth-service
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  test:
    name: Lint and test (${{ inputs.service }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ inputs.service }}/package-lock.json

      - run: npm ci

      # Each service defines a "lint" script (ESLint).
      - run: npm run lint --if-present

      # Coverage threshold (70%) is set in the service's Jest config; a miss fails this step.
      - run: npm test

  publish:
    name: Build and push (${{ inputs.service }})
    needs: test
    # Only a push to main publishes an image; PRs and other branches stop after tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service }}:sha-${{ github.sha }}
