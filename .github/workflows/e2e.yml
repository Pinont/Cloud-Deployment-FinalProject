name: E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - auth-service
      - restaurant-service
      - review-service
      - favorite-service
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    name: Compose integration tests
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'e2e-test-secret' }}
      IMAGE_TAG: latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull service images
        run: docker compose pull auth restaurant review favorite

      - name: Start the compose stack
        run: docker compose up -d --wait

      - name: Create an integration user and token
        shell: bash
        run: |
          email="ci-${GITHUB_RUN_ID}@example.com"
          password="ci-integration-password"
          curl --fail-with-body --silent --show-error \
            --retry 30 --retry-delay 2 --retry-connrefused \
            -X POST http://127.0.0.1/api/auth/register \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"$password\",\"name\":\"CI Integration\"}" \
            -o /dev/null
          token="$(
            curl --fail-with-body --silent --show-error \
              --retry 30 --retry-delay 2 --retry-connrefused \
              -X POST http://127.0.0.1/api/auth/login \
              -H 'content-type: application/json' \
              -d "{\"email\":\"$email\",\"password\":\"$password\"}" |
              jq -r '.token // empty'
          )"
          test -n "$token"
          echo "::add-mask::$token"
          echo "INTEGRATION_JWT=$token" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: favorite-service/package-lock.json

      - name: Install integration test dependencies
        working-directory: favorite-service
        run: npm ci

      - name: Run IT-01, IT-02, and IT-03
        working-directory: favorite-service
        env:
          INTEGRATION_BASE_URL: http://127.0.0.1/api
        run: npm run test:integration

      - name: Print compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the compose stack
        if: always()
        run: docker compose down --volumes

  e2e:
    name: Playwright E2E
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'e2e-test-secret' }}
      IMAGE_TAG: latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull service images
        run: docker compose pull auth restaurant review favorite

      - name: Start the compose stack
        run: docker compose up -d --wait

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

      - name: Stop the compose stack
        if: always()
        run: docker compose down --volumes
