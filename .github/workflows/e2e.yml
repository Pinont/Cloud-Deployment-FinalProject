name: E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - auth-service
      - restaurant-service
      - review-service
      - favorite-service
    types: [completed]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright E2E
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'e2e-test-secret' }}
      IMAGE_TAG: latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull service images
        run: docker compose pull auth restaurant review favorite

      - name: Start the compose stack
        run: docker compose up -d --wait

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

      - name: Stop the compose stack
        if: always()
        run: docker compose down --volumes
