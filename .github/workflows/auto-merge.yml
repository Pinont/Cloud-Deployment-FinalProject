# Turns on GitHub auto-merge for every non-draft PR. GitHub then merges each PR by itself
# once branch protection is satisfied (required check + approving review).
# This does not approve anything and does not bypass branch protection.
#
# Needs repo secret AUTO_MERGE_TOKEN: a fine-grained PAT (or GitHub App token) with
# Contents and Pull requests read/write. The default GITHUB_TOKEN is not used on purpose:
# a merge made with it does not start the push workflows, so the Docker image would
# never be published from main.
name: auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    # Any author, non-draft only. Never checks out or runs PR code.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repo secret AUTO_MERGE_TOKEN is not set; see the comment at the top of this file."
            exit 1
          fi
          gh pr merge --auto --squash "$PR_URL"
