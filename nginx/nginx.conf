# Gateway on port 80: static frontend at / and /api/<service>/ proxied to the services.
# Service names are the compose service names. Upstreams are resolved per request
# (Docker DNS), so the gateway starts even when a teammate's service is not up yet.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # The Authorization header is passed through unchanged (nginx default).
    # /api/auth/login -> http://auth:3001/auth/login
    location /api/auth/ {
        set $upstream auth:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/restaurants/ {
        set $upstream restaurant:3002;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/reviews/ {
        set $upstream review:3003;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/favorites/ {
        set $upstream favorite:3004;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
